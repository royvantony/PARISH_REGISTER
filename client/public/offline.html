<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b4332" />
    <title>No Connection — Parish Register</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #fbf9f4;
        color: #19231f;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e8e1d2;
        border-radius: 18px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 8px 24px -6px rgba(27, 67, 50, 0.08);
      }
      .icon-wrap {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: #f4efe6;
        border: 1px solid #e8e1d2;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .icon-wrap img {
        width: 44px;
        height: 44px;
        object-fit: contain;
        border-radius: 8px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #1b4332;
        background: #e8f3ed;
        padding: 4px 10px;
        border-radius: 999px;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.55;
        color: #5e6f65;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #1b4332;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #143527;
      }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        color: #b91c1c;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon-wrap">
        <img src="/icons/icon-192.png" alt="Parish Register" />
      </div>
      <span class="badge">Offline</span>
      <h1>No Connection</h1>
      <p>
        Unable to connect to the Parish Register server. Check your internet or Wi-Fi connection and try again.
      </p>
      <button id="retry-btn" type="button">Try Again</button>
      <div id="status-msg" class="status" role="status" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        var btn = document.getElementById('retry-btn');
        var statusEl = document.getElementById('status-msg');

        async function tryReconnect() {
          btn.disabled = true;
          btn.textContent = 'Checking connection...';
          statusEl.textContent = '';

          try {
            var res = await fetch('/api/health', { cache: 'no-store' });
            if (res.ok) {
              window.location.reload();
              return;
            }
          } catch (_) {
            // Still offline / server down
          }

          btn.disabled = false;
          btn.textContent = 'Try Again';
          statusEl.textContent = 'Still unable to reach the server.';
        }

        btn.addEventListener('click', tryReconnect);
        window.addEventListener('online', tryReconnect);
      })();
    </script>
  </body>
</html>
